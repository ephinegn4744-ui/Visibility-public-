
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Exams | Genius Students</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fb;color:#14233d}
header{background:#071a35;color:white;text-align:center;padding:25px}
header h1{color:#e8bd52}
header a{color:#e8bd52}
main{max-width:750px;margin:auto;padding:20px}
.card{background:white;padding:22px;border-radius:12px;margin:18px 0;box-shadow:0 3px 15px #0001}
select{padding:12px;width:100%;border:1px solid #ccc;border-radius:7px;margin-top:8px}
button{padding:12px 18px;background:#123f70;color:white;border:0;border-radius:7px;cursor:pointer;margin:5px}
.option{display:block;width:100%;text-align:left;background:#f0f3f9;color:#14233d;border:1px solid #ddd}
.option.selected{background:#e8bd52}
#quiz,#result{display:none}
#feedback{margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🎓 Genius Students</h1>
<p>Online Examination Center</p>
<a href="index.html">← Back to Home</a>
</header>

<main>
<div class="card" id="setup">
<h2>Start Your Examination</h2>
<label>Select Grade</label>
<select id="grade">
<option>Grade 9</option>
<option>Grade 10</option>
<option>Grade 11</option>
<option>Grade 12</option>
</select>
<label>Select Subject</label>
<select id="subject">
<option>Biology</option>
<option>Physics</option>
<option>Chemistry</option>
<option>Mathematics</option>
<option>English</option>
<option>ICT</option>
</select>
<button onclick="startExam()">Start Exam</button>
</div>

<div class="card" id="quiz">
<p id="progress"></p>
<h2 id="question"></h2>
<div id="options"></div>
<p id="feedback"></p>
<button onclick="nextQuestion()" id="next">Next Question</button>
</div>

<div class="card" id="result">
<h2>Examination Result</h2>
<h1 id="score"></h1>
<p id="message"></p>
<button onclick="location.reload()">Try Again</button>
</div>
</main>

<script>
const questions=[
{q:"Which organelle produces most cellular ATP?",o:["Nucleus","Mitochondrion","Ribosome","Golgi body"],a:1},
{q:"What is the basic unit of life?",o:["Tissue","Organ","Cell","System"],a:2},
{q:"Which molecule carries genetic information?",o:["DNA","Glucose","Water","Lipid"],a:0},
{q:"Which process do green plants use to make food?",o:["Respiration","Photosynthesis","Digestion","Fermentation"],a:1},
{q:"Which blood cells transport oxygen?",o:["White cells","Platelets","Red cells","Plasma"],a:2}
];

let current=0,answers=[],selected=-1;

function startExam(){
current=0;
answers=[];
document.getElementById("setup").style.display="none";
document.getElementById("quiz").style.display="block";
showQuestion();
}

function showQuestion(){
selected=-1;
let q=questions[current];
document.getElementById("progress").textContent=
"Question "+(current+1)+" of "+questions.length;
document.getElementById("question").textContent=q.q;
document.getElementById("feedback").textContent="";
document.getElementById("next").disabled=true;
document.getElementById("next").textContent=
current===questions.length-1?"Finish Exam":"Next Question";

let html="";
q.o.forEach((option,i)=>{
html+='<button class="option" onclick="choose('+i+',this)">'+
String.fromCharCode(65+i)+". "+option+"</button>";
});
document.getElementById("options").innerHTML=html;
}

function choose(i,button){
selected=i;
document.querySelectorAll(".option").forEach(b=>b.classList.remove("selected"));
button.classList.add("selected");
document.getElementById("next").disabled=false;
}

function nextQuestion(){
if(selected<0)return;
answers.push(selected);
if(current<questions.length-1){
current++;
showQuestion();
}else{
finishExam();
}
}

function finishExam(){
let correct=0;
answers.forEach((answer,i)=>{
if(answer===questions[i].a)correct++;
});
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("score").textContent=
correct+" / "+questions.length;
document.getElementById("message").textContent=
"Your score: "+Math.round(correct/questions.length*100)+"%. Keep learning!";
}
</script>
</body>
</html>
